<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CyberMagnet CRM</title>

<!-- Home-screen / PWA-ish meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CM CRM">
<meta name="theme-color" content="#0A0E14">
<link rel="manifest" href="/manifest.json">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">

<!-- iOS home-screen icons (Apple ignores manifest icons, needs these explicitly) -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="57x57" href="/icons/icon-57.png">
<link rel="apple-touch-icon" sizes="60x60" href="/icons/icon-60.png">
<link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72.png">
<link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/icons/icon-114.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --bg: #0A0E14;
    --surface: #10151D;
    --surface-2: #161D27;
    --surface-3: #1C2531;
    --border: #232C39;
    --border-soft: #1A222C;
    --text: #E8EDF4;
    --text-muted: #8B96A7;
    --text-dim: #566073;
    --accent: #2DD4FF;
    --accent-dim: rgba(45,212,255,0.14);
    --accent-2: #7C6CF0;
    --success: #35D48A;
    --success-dim: rgba(53,212,138,0.14);
    --warning: #FFB020;
    --warning-dim: rgba(255,176,32,0.14);
    --danger: #FF5C7A;
    --danger-dim: rgba(255,92,122,0.14);
    --neutral: #8B96A7;
    --neutral-dim: rgba(139,150,167,0.14);
    --radius: 12px;
    --radius-sm: 8px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(45,212,255,0.06), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(124,108,240,0.05), transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  ::selection{ background: var(--accent-dim); color: var(--accent); }
  a{ color: inherit; }
  button{ font-family: inherit; cursor:pointer; }
  input, select, textarea{ font-family: inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Header ---------- */
  .topbar{
    position: sticky; top:0; z-index: 30;
    background: rgba(10,14,20,0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
  }
  .topbar-inner{
    max-width: 1280px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background: linear-gradient(155deg, var(--surface-3), var(--surface));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
  }
  .brand-mark svg{ width:20px; height:20px; }
  .brand-text h1{
    font-family: var(--font-display); font-size:17px; font-weight:700;
    margin:0; letter-spacing:-0.01em; line-height:1.1;
  }
  .brand-text span{
    display:block; font-size:11px; color: var(--text-dim);
    letter-spacing: 0.06em; text-transform: uppercase; margin-top:2px;
  }
  .stats-row{ display:flex; gap:8px; }
  .stat-chip{
    background: var(--surface); border:1px solid var(--border-soft);
    border-radius: 999px; padding:6px 14px;
    font-size:12px; color: var(--text-muted); display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .stat-chip b{ color: var(--text); font-family: var(--font-mono); font-weight:500; }
  .stat-dot{ width:6px; height:6px; border-radius:50%; }

  .signout-btn{
    display:flex; align-items:center; gap:6px;
    background: transparent; border:1px solid var(--border-soft); color: var(--text-dim);
    padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:500;
    white-space:nowrap; flex-shrink:0;
  }
  .signout-btn:hover{ background: var(--surface-3); color: var(--text); border-color: var(--border); }
  .signout-btn svg{ width:14px; height:14px; }

  @media (max-width: 720px){
    .stats-row{ display:none; }
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    border-bottom: 1px solid var(--border-soft);
    background: rgba(10,14,20,0.6);
  }
  .tabbar-inner{
    max-width:1280px; margin:0 auto; padding: 0 20px;
    display:flex; gap:4px;
  }
  .tab-btn{
    background:transparent; border:none; color: var(--text-dim);
    font-size:13.5px; font-weight:600; padding:13px 6px; margin-right:22px;
    border-bottom: 2px solid transparent; display:flex; align-items:center; gap:8px;
  }
  .tab-btn:hover{ color: var(--text-muted); }
  .tab-btn.active{ color: var(--text); border-bottom-color: var(--accent); }
  .tab-badge{
    display:none; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background: var(--accent); color:#04121A; font-size:11px; font-weight:700;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1280px; margin: 18px auto 0; padding: 0 20px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  .search-wrap{
    position:relative; flex:1 1 220px; min-width:180px;
  }
  .search-wrap input{
    width:100%; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:10px 12px 10px 36px;
    color: var(--text); font-size:14px;
  }
  .search-wrap input::placeholder{ color: var(--text-dim); }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color: var(--text-dim);
  }
  select.filter-select{
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:10px 12px; color: var(--text); font-size:13px;
    appearance:none; -webkit-appearance:none;
  }
  .btn{
    border:1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: var(--radius-sm);
    padding:10px 14px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
    transition: border-color .15s, transform .1s, background .15s;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ border-color: var(--text-dim); }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: linear-gradient(135deg, var(--accent), #1AA6D4);
    color:#00131A; border:none;
  }
  .btn-primary:hover{ filter:brightness(1.08); border-color:transparent; }
  .btn-ghost{ background:transparent; }
  .btn-icon-only{ padding:10px; }

  /* ---------- List Header (desktop grid) ---------- */
  .list-wrap{ max-width:1280px; margin: 16px auto 0; padding: 0 20px; }
  .list-head{
    display:grid;
    grid-template-columns: 2.2fr 1fr 1.1fr 0.9fr 1fr 96px 28px;
    gap:12px; padding: 0 16px 8px;
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--text-dim); font-weight:600;
  }
  .list-head span{ cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px;}
  .list-head span:hover{ color: var(--text-muted); }
  .list-head svg{ width:11px; height:11px; opacity:.6; }
  @media (max-width: 900px){ .list-head{ display:none; } }

  .row-card{
    display:grid;
    grid-template-columns: 2.2fr 1fr 1.1fr 0.9fr 1fr 96px 28px;
    gap:12px; align-items:center;
    background: var(--surface);
    border:1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 13px 16px;
    margin-bottom: 8px;
    cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .row-card:hover{ border-color: var(--border); background: var(--surface-2); }
  .row-card.selected{ border-color: var(--accent); background: var(--accent-dim); }

  .cell-company .co-name{ font-weight:600; font-size:14.5px; }
  .cell-company .co-sub{
    font-size:12px; color: var(--text-dim); margin-top:2px;
    display:flex; align-items:center; gap:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cell-category{ font-size:13px; color: var(--text-muted); }
  .cell-phone{ font-family: var(--font-mono); font-size:13px; color: var(--text-muted); }
  .cell-rating{ display:flex; align-items:center; gap:4px; }
  .stars{ display:flex; gap:1px; }
  .stars svg{ width:13px; height:13px; }
  .star-fill{ color: var(--warning); }
  .star-empty{ color: var(--border); }
  .rating-num{ font-size:11px; color: var(--text-dim); font-family: var(--font-mono); margin-left:3px; }

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding: 4px 10px; border-radius:999px; font-size:11.5px; font-weight:600;
    width: fit-content;
  }
  .pill-dot{ width:6px; height:6px; border-radius:50%; }

  .call-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background: var(--surface-3); border:1px solid var(--border);
    color: var(--accent); border-radius: 999px; padding:8px 12px;
    font-size:12px; font-weight:600; position:relative; overflow:visible;
    text-decoration:none;
  }
  .call-btn svg{ width:13px; height:13px; }
  .call-btn .ring{
    position:absolute; inset:0; border-radius:999px; border:1.5px solid var(--accent);
    opacity:0; pointer-events:none;
  }
  .call-btn:hover .ring{ animation: magnetPulse 1.1s ease-out infinite; }
  .call-btn:hover{ border-color: var(--accent); background: var(--accent-dim); }
  @keyframes magnetPulse{
    0%{ opacity:0.55; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.35); }
  }
  @media (prefers-reduced-motion: reduce){ .call-btn:hover .ring{ animation:none; } }

  .chevron{ color: var(--text-dim); display:flex; justify-content:center; }
  .chevron svg{ width:15px; height:15px; }

  /* Mobile card layout */
  @media (max-width: 900px){
    .row-card{
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "company call"
        "meta call"
        "tags tags";
      row-gap:8px;
    }
    .cell-company{ grid-area: company; }
    .cell-category{ display:none; }
    .cell-phone{ display:none; }
    .cell-rating{ grid-area: meta; }
    .cell-status{ grid-area: tags; }
    .cell-call{ grid-area: call; align-self:start; }
    .chevron{ display:none; }
  }

  .empty-state{
    text-align:center; padding: 70px 20px; color: var(--text-dim);
  }
  .empty-state svg{ width:44px; height:44px; margin-bottom:14px; color: var(--border); }
  .empty-state h3{ color: var(--text-muted); font-family: var(--font-display); margin: 0 0 6px; }
  .empty-state p{ margin:0 0 18px; font-size:13.5px; }

  /* ---------- Overlay / Panel ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(5,7,10,0.6);
    backdrop-filter: blur(3px);
    z-index:50; opacity:0; pointer-events:none; transition: opacity .18s;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .panel{
    position:fixed; top:0; right:0; height:100%; width:440px; max-width:100vw;
    background: var(--surface); border-left:1px solid var(--border);
    z-index:60; transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.3,1);
    display:flex; flex-direction:column;
  }
  .panel.open{ transform: translateX(0); }
  @media (max-width: 620px){
    .panel{ width:100%; }
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(16px + env(safe-area-inset-top)) 18px 16px; border-bottom:1px solid var(--border-soft);
  }
  .panel-head h2{ font-family:var(--font-display); font-size:16px; margin:0; }
  .icon-btn{
    background:transparent; border:none; color: var(--text-dim);
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background: var(--surface-3); color: var(--text); }
  .icon-btn svg{ width:17px; height:17px; }

  .panel-body{ flex:1; overflow-y:auto; padding: 18px; }
  .panel-foot{ padding:14px 18px; border-top:1px solid var(--border-soft); display:flex; gap:10px; }

  .field-group{ margin-bottom: 14px; }
  .field-group label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color: var(--text-dim); margin-bottom:6px; font-weight:600;
  }
  .field-group input, .field-group select, .field-group textarea{
    width:100%; background: var(--surface-2); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:9px 11px; color: var(--text); font-size:13.5px;
  }
  .field-group textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field-group{ flex:1; }

  .call-cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: linear-gradient(135deg, var(--accent), #1AA6D4); color:#00131A;
    border-radius: var(--radius-sm); padding:11px; font-weight:700; font-size:14px;
    text-decoration:none; position:relative; margin-bottom:16px;
  }
  .call-cta svg{ width:16px; height:16px; }
  .call-cta .ring{ position:absolute; inset:0; border-radius:var(--radius-sm); border:1.5px solid var(--accent); opacity:0; }
  .call-cta:hover .ring{ animation: magnetPulse 1.1s ease-out infinite; }

  .rating-input{ display:flex; align-items:center; gap:10px; }
  .rating-input .stars-edit{ display:flex; gap:3px; }
  .rating-input .stars-edit svg{ width:20px; height:20px; cursor:pointer; color: var(--border); }
  .rating-input .stars-edit svg.active{ color: var(--warning); }
  .rating-input span{ font-family: var(--font-mono); font-size:13px; color: var(--text-muted); }

  .notes-section h4{
    font-family: var(--font-display); font-size:13px; margin: 4px 0 10px;
    display:flex; align-items:center; gap:6px; color: var(--text-muted);
  }
  .note-item{
    background: var(--surface-2); border:1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding:10px 12px; margin-bottom:8px; font-size:13px;
  }
  .note-item .note-ts{ font-size:11px; color: var(--text-dim); margin-bottom:4px; font-family: var(--font-mono); }
  .note-add{ display:flex; gap:8px; margin-top:6px; }
  .note-add textarea{ flex:1; }
  .note-add button{
    background: var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-sm);
    color: var(--accent); padding: 0 14px; font-weight:600; font-size:12.5px;
  }

  .status-select-wrap select{
    font-weight:600;
  }

  .link-line{
    display:flex; align-items:center; gap:8px; font-size:13px; color: var(--accent);
    padding: 9px 0; text-decoration:none; word-break:break-all;
  }
  .link-line svg{ width:14px; height:14px; flex-shrink:0; }

  .danger-btn{
    background: var(--danger-dim); color: var(--danger); border:1px solid rgba(255,92,122,0.3);
    border-radius: var(--radius-sm); padding: 9px 14px; font-weight:600; font-size:13px;
    display:flex; align-items:center; gap:6px; width:100%; justify-content:center;
  }
  .danger-btn:hover{ background: rgba(255,92,122,0.22); }

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed; inset:0; background:rgba(5,7,10,0.65); backdrop-filter: blur(4px);
    z-index:70; display:flex; align-items:flex-start; justify-content:center;
    padding: calc(40px + env(safe-area-inset-top)) 16px 40px; overflow-y:auto;
    opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .modal-back.open{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--surface); border:1px solid var(--border); border-radius: 16px;
    width:100%; max-width: 620px; padding:22px; margin-top: 20px;
  }
  .modal h2{ font-family: var(--font-display); margin:0 0 4px; font-size:19px; }
  .modal .sub{ color: var(--text-dim); font-size:13px; margin-bottom:18px; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 20px; }

  .map-table{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px; }
  .map-table th{ text-align:left; color: var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; padding-bottom:8px; }
  .map-table td{ padding: 6px 8px 6px 0; border-top:1px solid var(--border-soft); }
  .map-table select{
    width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:6px 8px; color: var(--text); font-size:12.5px;
  }
  .csv-col-name{ font-family: var(--font-mono); color: var(--accent); font-size:12px; }
  .csv-preview{ font-size:11.5px; color: var(--text-dim); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .upload-zone{
    border: 1.5px dashed var(--border); border-radius: var(--radius);
    padding: 34px 20px; text-align:center; color: var(--text-dim); cursor:pointer;
    transition: border-color .15s, background .15s;
  }
  .upload-zone:hover{ border-color: var(--accent); background: var(--accent-dim); }
  .upload-zone svg{ width:30px; height:30px; margin-bottom:10px; color: var(--text-dim); }
  .upload-zone strong{ color: var(--text-muted); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background: var(--surface-3); border:1px solid var(--border); color: var(--text);
    padding:11px 18px; border-radius: 999px; font-size:13px; z-index:100;
    opacity:0; pointer-events:none; transition: opacity .2s, transform .2s;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }
  .toast svg{ width:14px; height:14px; color: var(--success); }

  /* ---------- Daily Queue ---------- */
  .queue-view{ max-width:520px; margin:0 auto; padding: 26px 20px 40px; }
  .queue-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .queue-head h2{ font-family:var(--font-display); font-size:20px; margin:0 0 4px; }
  .queue-head .sub{ color:var(--text-dim); font-size:13px; }
  .queue-progress{ flex:1; max-width:220px; }
  .queue-progress-track{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; margin-bottom:6px; }
  .queue-progress-fill{ height:100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width .3s ease; }
  .queue-progress-text{ font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); }

  .queue-stack{ position:relative; height:420px; margin-bottom:22px; touch-action:pan-y; }
  .queue-card{
    position:absolute; inset:0; background: var(--surface); border:1px solid var(--border);
    border-radius: 20px; padding:22px; display:flex; flex-direction:column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    user-select:none; cursor:grab; will-change:transform;
  }
  .queue-card:active{ cursor:grabbing; }
  .qc-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:auto; }
  .qc-grade{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    border:1.5px solid; border-radius:10px; padding:4px 10px; line-height:1;
  }
  .qc-tag{ font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; }
  .qc-tag-new{ background: var(--accent-dim); color: var(--accent); }
  .qc-tag-followup{ background: var(--warning-dim); color: var(--warning); }

<script>
/* ============ CONFIG ============ */
const STORAGE_KEY = 'cybermagnet_crm_contacts_v1';
const STATUSES = [
  { id:'lead', label:'Lead', color:'var(--neutral)', dim:'var(--neutral-dim)' },
  { id:'contacted', label:'Contacted', color:'var(--accent)', dim:'var(--accent-dim)' },
  { id:'proposal', label:'Proposal Sent', color:'var(--accent-2)', dim:'rgba(124,108,240,0.16)' },
  { id:'client', label:'Client', color:'var(--success)', dim:'var(--success-dim)' },
  { id:'inactive', label:'Inactive', color:'var(--danger)', dim:'var(--danger-dim)' },
];
const CALLED_OPTIONS = [
  { id:'no', label:'Not yet' },
  { id:'yes', label:'Yes' },
];
const OUTCOMES = [
  { id:'', label:'No outcome yet' },
  { id:'no', label:'No' },
  { id:'not_now', label:'Not right now' },
  { id:'talk_more', label:"Let's talk more" },
  { id:'yes', label:'Yes' },
];
const FIELD_DEFS = [
  { key:'company', label:'Company name', keywords:['company','businessname','business','name','client','clientname','organization'] },
  { key:'category', label:'Category / Industry', keywords:['category','industry','type','niche','sector'] },
  { key:'phone', label:'Phone', keywords:['phone','phonenumber','tel','telephone','mobile','cell'] },
  { key:'website', label:'Website', keywords:['website','url','site','web','domain'] },
  { key:'email', label:'Email', keywords:['email','emailaddress','mail'] },
  { key:'address', label:'Address', keywords:['address','location','streetaddress','fulladdress'] },
  { key:'rating', label:'Rating', keywords:['rating','stars','score','googlerating','review'] },
  { key:'status', label:'Status', keywords:['status','stage','pipelinestage','pipeline'] },
  { key:'owner', label:'Owner', keywords:['owner','ownername','contactname','pointofcontact','poc','manager'] },
  { key:'offering', label:'What they offer', keywords:['offering','offerings','services','service','servicesoffered','whattheyoffer','products'] },
  { key:'hours', label:'Company hours', keywords:['hours','businesshours','companyhours','operatinghours','openhours'] },
  { key:'called', label:'Called?', keywords:['called','callmade','contacted2','callstatus','callattempted'] },
  { key:'outcome', label:'Call outcome', keywords:['outcome','result','callresult','calloutcome','response'] },
  { key:'notes', label:'Notes', keywords:['notes','note','comment','comments'] },
];

/* ============ STATE ============ */
let contacts = [];
let selectedId = null;
let sortMode = 'updated_desc';
let statusFilter = '';
let searchTerm = '';
let csvParsedRows = [];
let csvHeaders = [];
let csvMapping = {};

/* ============ API (Cloudflare Pages Functions + D1) ============ */
const API_BASE = '/api/contacts';

async function apiFetch(url, options){
  let res;
  try{
    res = await fetch(url, options);
  }catch(e){
    showToast('Could not reach the server — check your connection', true);
    throw e;
  }
  if(!res.ok){
    let msg = 'Server error';
    try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
    showToast(msg, true);
    throw new Error(msg);
  }
  return res.json();
}

async function loadContacts(){
  setLoading(true);
  try{
    const data = await apiFetch(API_BASE);
    contacts = data.contacts || [];
  }catch(e){
    contacts = [];
  }
  setLoading(false);
}

async function createContact(rec){
  const data = await apiFetch(API_BASE, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(rec),
  });
  return (data.contacts || [])[0];
}

async function bulkCreateContacts(records){
  const CHUNK = 40;
  const created = [];
  for(let i=0; i<records.length; i+=CHUNK){
    const chunk = records.slice(i, i+CHUNK);
    const data = await apiFetch(API_BASE, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ bulk: chunk }),
    });
    created.push(...(data.contacts || []));
  }
  return created;
}

async function patchContact(id, fields){
  await apiFetch(`${API_BASE}/${id}`, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(fields),
  });
}

async function deleteContactApi(id){
  await apiFetch(`${API_BASE}/${id}`, { method:'DELETE' });
}

async function addNoteApi(id, text){
  const data = await apiFetch(`${API_BASE}/${id}/notes`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ text }),
  });
  return data.note;
}

function setLoading(isLoading){
  const body = document.getElementById('listBody');
  if(isLoading){
    body.innerHTML = `<div class="empty-state"><p>Loading your pipeline…</p></div>`;
  }
}


/* ============ ICONS ============ */
const ICON = {
  globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg>`,
  mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.4 2.1L8.1 9.7a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.6 7.2.8-5.3 5 1.4 7.2L12 18l-6.4 3.6 1.4-7.2-5.3-5 7.2-.8z"/></svg>`,
  starOutline: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l3.1 6.6 7.2.8-5.3 5 1.4 7.2L12 18l-6.4 3.6 1.4-7.2-5.3-5 7.2-.8z"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M4 21h16"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`,
};
function starRow(rating, size=13){
  const r = Math.round(rating || 0);
  let s = '<div class="stars">';
  for(let i=1;i<=5;i++){
    s += `<span class="${i<=r?'star-fill':'star-empty'}" style="width:${size}px;height:${size}px;display:flex">${i<=r?ICON.star:ICON.starOutline}</span>`;
  }
  s += '</div>';
  return s;
}
function statusMeta(id){ return STATUSES.find(s=>s.id===id) || STATUSES[0]; }

/* ============ RENDER: STATS ============ */
function renderStats(){
  const total = contacts.length;
  const byStatus = {};
  STATUSES.forEach(s=> byStatus[s.id] = 0);
  contacts.forEach(c=>{ if(byStatus[c.status] !== undefined) byStatus[c.status]++; });
  let html = `<div class="stat-chip"><span class="stat-dot" style="background:var(--accent)"></span>Total <b>${total}</b></div>`;
  STATUSES.forEach(s=>{
    if(byStatus[s.id] > 0 || s.id==='client' || s.id==='lead'){
      html += `<div class="stat-chip"><span class="stat-dot" style="background:${s.color}"></span>${s.label} <b>${byStatus[s.id]}</b></div>`;
    }
  });
  document.getElementById('statsRow').innerHTML = html;

  const filterSel = document.getElementById('statusFilter');
  const currentVal = filterSel.value;
  filterSel.innerHTML = '<option value="">All statuses</option>' + STATUSES.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
  filterSel.value = currentVal;
}

/* ============ RENDER: LIST ============ */
function getFiltered(){
  let list = contacts.slice();
  if(statusFilter){ list = list.filter(c=>c.status===statusFilter); }
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    list = list.filter(c => [c.company,c.phone,c.address,c.category,c.email,c.website].join(' ').toLowerCase().includes(t));
  }
  switch(sortMode){
    case 'company_asc': list.sort((a,b)=>(a.company||'').localeCompare(b.company||'')); break;
    case 'rating_desc': list.sort((a,b)=>(b.rating||0)-(a.rating||0)); break;
    case 'status_asc': list.sort((a,b)=>(a.status||'').localeCompare(b.status||'')); break;
    default: list.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  }
  return list;
}

function renderList(){
  const list = getFiltered();
  const body = document.getElementById('listBody');
  if(list.length === 0){
    body.innerHTML = `
      <div class="empty-state">
        ${ICON.globe.replace('stroke-width="2"','stroke-width="1.4"')}
        <h3>${contacts.length===0 ? 'No businesses yet' : 'No matches'}</h3>
        <p>${contacts.length===0 ? 'Upload a CSV or add your first business to get the pipeline going.' : 'Try a different search or filter.'}</p>
      </div>`;
    return;
  }
  body.innerHTML = list.map(c=>{
    const sm = statusMeta(c.status);
    const noteCount = (c.notes||[]).length;
    return `
    <div class="row-card ${c.id===selectedId?'selected':''}" data-id="${c.id}">
      <div class="cell-company">
        <div class="co-name">${escapeHtml(c.company || 'Unnamed business')}</div>
        <div class="co-sub">${c.website ? escapeHtml(stripUrl(c.website)) : (c.address ? escapeHtml(c.address) : '')}</div>
      </div>
      <div class="cell-category">${escapeHtml(c.category || '—')}</div>
      <div class="cell-phone">${c.phone ? escapeHtml(c.phone) : '—'}</div>
      <div class="cell-rating">${starRow(c.rating)}<span class="rating-num">${c.rating ? c.rating.toFixed(1) : '—'}</span></div>
      <div class="cell-status">
        <span class="pill" style="background:${sm.dim};color:${sm.color}">
          <span class="pill-dot" style="background:${sm.color}"></span>${sm.label}
        </span>
      </div>
      <div class="cell-call">
        ${c.phone ? `<a class="call-btn" href="tel:${sanitizePhone(c.phone)}" onclick="event.stopPropagation()">${ICON.phone}<span class="ring"></span></a>` : ''}
      </div>
      <div class="chevron">${ICON.chevron}</div>
    </div>`;
  }).join('');

  body.querySelectorAll('.row-card').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(el.getAttribute('data-id')));
  });
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function stripUrl(u){ return u.replace(/^https?:\/\//,'').replace(/\/$/,''); }
function sanitizePhone(p){ return p.replace(/[^\d+]/g,''); }

/* ============ OVERLAY BACK-NAVIGATION ============
   In standalone (home-screen) mode there's no browser chrome, so a swipe-back
   gesture or Android hardware back button would otherwise do nothing, or exit
   the app entirely. This pushes a history entry whenever a panel/modal opens
   so that gesture is caught here and just closes the overlay instead. */
let overlayHistoryPushed = false;
function pushOverlayState(){
  if(!overlayHistoryPushed){
    overlayHistoryPushed = true;
    history.pushState({ crmOverlay: true }, '');
  }
}
function popOverlayState(fromPopstate){
  if(overlayHistoryPushed){
    overlayHistoryPushed = false;
    if(!fromPopstate) history.back();
  }
}
function closeTopOverlay(fromPopstate){
  if(document.getElementById('queueSettingsModalBack').classList.contains('open')) closeQueueSettingsModal(fromPopstate);
  else if(document.getElementById('csvModalBack').classList.contains('open')) closeCsvModal(fromPopstate);
  else if(document.getElementById('formModalBack').classList.contains('open')) closeFormModal(fromPopstate);
  else if(document.getElementById('panel').classList.contains('open')) closeDetail(fromPopstate);
}
window.addEventListener('popstate', ()=>{ overlayHistoryPushed = false; closeTopOverlay(true); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeTopOverlay(); });

/* ============ SIGN OUT ============
   HTTP Basic Auth has no real "log out" — credentials live in the browser's
   auth cache, not a cookie. Sending a deliberately-wrong Authorization header
   forces that cached credential to be overwritten, so the next request gets
   re-prompted. Works in Safari/Chrome; if a device doesn't re-prompt right
   away, fully closing and reopening the app clears it. */
document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  if(!confirm('Sign out of the CRM?')) return;
  try{
    await fetch(location.pathname + '?signout=' + Date.now(), {
      headers: { 'Authorization': 'Basic ' + btoa('signed-out:signed-out') },
      cache: 'no-store',
    });
  }catch(e){ /* ignore */ }
  location.reload();
});

function normalizeHeader(h){ return h.toLowerCase().replace(/[^a-z0-9]/g,''); }
function normalizeCalled(val){
  const v = (val||'').toLowerCase().trim();
  return ['yes','y','true','1','called'].includes(v) ? 'yes' : 'no';
}
function normalizeOutcome(val){
  const v = (val||'').toLowerCase().trim();
  if(!v) return '';
  // exact/label match first
  const exact = OUTCOMES.find(o=> o.id && (o.id===v || o.label.toLowerCase()===v));
  if(exact) return exact.id;
  // loose synonym matching for common free-text phrasing
  if(/(not.*right.*now|not.*now|later|follow.*up)/.test(v)) return 'not_now';
  if(/(talk.*more|maybe|interested|thinking|considering)/.test(v)) return 'talk_more';
  if(/(^yes$|signed|closed.*won|won|onboard)/.test(v)) return 'yes';
  if(/(^no$|not.*interested|declined|closed.*lost|refused)/.test(v)) return 'no';
  return '';
}
function autoMapHeaders(){
  csvMapping = {};
  csvHeaders.forEach(h=>{
    const norm = normalizeHeader(h);
    let matched = null;
    for(const fd of FIELD_DEFS){
      if(fd.keywords.some(k=>norm===k || norm.includes(k))){ matched = fd.key; break; }
    }
    csvMapping[h] = matched;
  });
}

async function importCsv(){
  const importBtn = document.getElementById('csvImport');
  if(importBtn){ importBtn.disabled = true; importBtn.textContent = 'Importing…'; }

  const records = [];
  csvParsedRows.forEach(row=>{
    const rec = { status:'lead', notes: [], source:'csv', rating:0, called:'no', outcome:'' };
    Object.keys(row).forEach(h=>{
      const field = csvMapping[h];
      if(!field) return;
      let val = (row[h]||'').toString().trim();
      if(field === 'rating'){ rec.rating = parseFloat(val) || 0; }
      else if(field === 'notes'){ if(val) rec.notes.push({ text: val }); }
      else if(field === 'status'){
        const match = STATUSES.find(s=>s.label.toLowerCase()===val.toLowerCase() || s.id===val.toLowerCase());
        rec.status = match ? match.id : 'lead';
      }
      else if(field === 'called'){ rec.called = normalizeCalled(val); }
      else if(field === 'outcome'){ rec.outcome = normalizeOutcome(val); }
      else { rec[field] = val; }
    });
    if(rec.company) records.push(rec);
  });

  try{
    const created = await bulkCreateContacts(records);
    contacts.push(...created);
    closeCsvModal();
    renderList(); renderStats();
    showToast(`Imported ${created.length} businesses`);
  }catch(e){ /* toast already shown */ }

  if(importBtn){ importBtn.disabled = false; }
}

  const rows = contacts.map(c=>{
    const statusLabel = statusMeta(c.status).label;

    const outcomeLabel = (OUTCOMES.find(o=>o.id===c.outcome)||{}).label || '';
    const notesJoined = (c.notes||[]).map(n=> `[${new Date(n.ts).toLocaleDateString()}] ${n.text}`).join(' | ');

  });
  const csv = Papa.unparse({ fields: headers, data: rows });
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `cybermagnet-crm-export-${new Date().toISOString().slice(0,10)}.csv`;

/* ---- date / storage helpers ---- */
function todayKey(){ return new Date().toISOString().slice(0,10); }
function cleanupOldQueueStorage(){
  const tk = todayKey();
  Object.keys(localStorage).forEach(k=>{
    if((k.startsWith('cm_queue_ids_') || k.startsWith('cm_queue_done_') || k.startsWith('cm_queue_total_')) && !k.endsWith(tk)){
      localStorage.removeItem(k);
    }
  });
}
function getDoneToday(){
  try{ return JSON.parse(localStorage.getItem('cm_queue_done_' + todayKey())) || []; }catch(e){ return []; }
}
function markDoneToday(id){
  const key = 'cm_queue_done_' + todayKey();
  const done = getDoneToday();
  if(!done.includes(id)) done.push(id);
  localStorage.setItem(key, JSON.stringify(done));
}
function persistQueueIds(){ localStorage.setItem('cm_queue_ids_' + todayKey(), JSON.stringify(queueIds)); }
function persistQueueTotal(){ localStorage.setItem('cm_queue_total_' + todayKey(), String(queueTotalToday)); }

/* ---- settings (daily count + follow-up intervals), stored per-browser ---- */
function getQueueSettings(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem('cm_queue_settings')); }catch(e){}
  const defaults = { dailyCount: 8, followUp: { contacted: 3, proposal: 5, client: 30 } };
  return Object.assign({}, defaults, s || {}, { followUp: Object.assign({}, defaults.followUp, (s && s.followUp) || {}) });
}
function saveQueueSettings(s){ localStorage.setItem('cm_queue_settings', JSON.stringify(s)); }

/* ---- lead grade, from the existing 0–5 rating field ---- */
function gradeFromRating(rating){
  const r = parseFloat(rating) || 0;
  if(r <= 0) return { label:'—', color:'var(--text-dim)' };
  if(r >= 4.5) return { label:'A+', color:'var(--success)' };
  if(r >= 4.0) return { label:'A', color:'var(--success)' };
  if(r >= 3.5) return { label:'B+', color:'var(--accent)' };
  if(r >= 3.0) return { label:'B', color:'var(--accent)' };
  if(r >= 2.0) return { label:'C', color:'var(--warning)' };
  return { label:'D', color:'var(--danger)' };
}

/* ---- suggested service, from category/company keywords ---- */
const SERVICE_RULES = [
  { keywords:['roof','contract','construct','plumb','electric','hvac','remodel','paint','landscap','lawn','fence','concrete','handyman'], service:'AI Receptionist + Website' },
  { keywords:['salon','spa','beauty','nail','hair','barber','wellness','massage','fitness','gym','yoga','pilates'], service:'Booking Funnel + AI Receptionist' },
  { keywords:['real estate','realtor','property','realty'], service:'Lead Funnel + CRM Automation' },
  { keywords:['restaurant','cafe','bakery','catering','food','diner','bar','brewery','coffee'], service:'Social Media + Local SEO' },
  { keywords:['entertain','event','venue','photo','studio','dj ','music'], service:'Website + Social Media' },
  { keywords:['auto','mechanic','tire','detail'], service:'AI Receptionist + Website' },
  { keywords:['law','legal','attorney'], service:'Website + Lead Funnel' },
  { keywords:['dental','dentist','clinic','medical','health'], service:'AI Receptionist + Booking Funnel' },
];
function suggestService(c){
  const cat = (c.category || '').toLowerCase();
  const name = (c.company || '').toLowerCase();
  for(const rule of SERVICE_RULES){
    if(rule.keywords.some(k => cat.includes(k) || name.includes(k))) return rule.service;
  }
  return 'Website + SEO';
}

/* ---- which contacts are due today, and why ---- */
function queueLabelFor(c){
  if(c.status === 'lead') return { tag:'New Lead', tone:'new' };
  if(c.status === 'contacted') return { tag:'Follow-up · On the fence', tone:'followup' };
  if(c.status === 'proposal') return { tag:'Follow-up · Proposal sent', tone:'followup' };
  if(c.status === 'client') return { tag:'Check-in · Client', tone:'client' };
  return { tag:'Follow-up', tone:'followup' };
}
function computeEligiblePool(){
  const settings = getQueueSettings();
  const now = Date.now();
  return contacts.filter(c=>{
    if(c.status === 'inactive') return false;
    if(c.status === 'lead') return true;
    const days = (now - (c.updatedAt || c.createdAt || now)) / 86400000;
    if(c.status === 'contacted') return days >= settings.followUp.contacted;
    if(c.status === 'proposal') return days >= settings.followUp.proposal;
    if(c.status === 'client') return days >= settings.followUp.client;
    return false;
  }).sort((a,b)=>{
    const aNew = a.status === 'lead', bNew = b.status === 'lead';
    if(aNew !== bNew) return aNew ? -1 : 1;
    if(aNew) return (a.createdAt||0) - (b.createdAt||0);
    return (a.updatedAt||0) - (b.updatedAt||0);
  });
}

/* ---- today's fixed batch: built once per day, cached, worked through ---- */
let queueIds = [];
let queueTotalToday = 0;

function initQueueForToday(){
  cleanupOldQueueStorage();
  const idsKey = 'cm_queue_ids_' + todayKey();
  const cached = localStorage.getItem(idsKey);
  if(cached !== null){
    try{
      queueIds = JSON.parse(cached).filter(id => contacts.some(c=>c.id===id && c.status !== 'inactive'));
    }catch(e){ queueIds = []; }
    queueTotalToday = parseInt(localStorage.getItem('cm_queue_total_' + todayKey()) || '0', 10) || (queueIds.length + getDoneToday().length);
  } else {
    const settings = getQueueSettings();
    const done = getDoneToday();
    const pool = computeEligiblePool().filter(c => !done.includes(c.id));
    queueIds = pool.slice(0, settings.dailyCount).map(c=>c.id);
    queueTotalToday = queueIds.length + done.length;
    persistQueueIds();
    persistQueueTotal();
  }
  renderQueueStack();
}

function loadMoreQueue(){
  const settings = getQueueSettings();
  const done = getDoneToday();
  const exclude = new Set([...done, ...queueIds]);
  const pool = computeEligiblePool().filter(c => !exclude.has(c.id));
  const more = pool.slice(0, settings.dailyCount).map(c=>c.id);
  if(more.length === 0){ showToast("That's everyone eligible right now"); return; }
  queueIds = queueIds.concat(more);
  queueTotalToday += more.length;
  persistQueueIds();
  persistQueueTotal();
  renderQueueStack();
}

function updateQueueProgress(){
  const doneCount = getDoneToday().length;
  const remaining = queueIds.length;
  const total = Math.max(queueTotalToday, doneCount + remaining);
  const fill = document.getElementById('queueProgressFill');
  const text = document.getElementById('queueProgressText');
  if(text) text.textContent = total > 0 ? `${doneCount} of ${total} today` : 'Nothing due today';
  if(fill) fill.style.width = total > 0 ? Math.round((doneCount/total)*100) + '%' : '0%';
  refreshQueueBadge(remaining);
}
function refreshQueueBadge(remainingOverride){
  const badge = document.getElementById('queueBadge');
  if(!badge) return;
  const remaining = remainingOverride != null ? remainingOverride : queueIds.length;
  if(remaining > 0){ badge.style.display='inline-flex'; badge.textContent = String(remaining); }
  else badge.style.display = 'none';
}

/* ---- rendering the card stack ---- */
function cardHtml(c){
  const grade = gradeFromRating(c.rating);
  const label = queueLabelFor(c);
  const service = suggestService(c);
  const phoneHtml = c.phone
    ? `<div class="qc-phone">${escapeHtml(c.phone)}</div>`
    : `<div class="qc-phone empty">No phone on file</div>`;
  return `
    <div class="queue-card" data-id="${c.id}">
      <div class="qc-top">
        <span class="qc-grade" style="color:${grade.color}; border-color:${grade.color};">${grade.label}</span>
        <span class="qc-tag qc-tag-${label.tone}">${label.tag}</span>
      </div>
      <div class="qc-body">
        <h3 class="qc-name">${escapeHtml(c.company)}</h3>
        <div class="qc-category">${escapeHtml(c.category || 'Uncategorized')}</div>
        ${phoneHtml}
      </div>
      <div class="qc-service"><span class="qc-service-label">Suggested service</span>${escapeHtml(service)}</div>
      <div class="qc-swipe-hint qc-hint-pass">Skip</div>
      <div class="qc-swipe-hint qc-hint-keep">Reached out</div>
    </div>`;
}
function renderQueueStack(){
  const stack = document.getElementById('queueStack');
  const visible = queueIds.slice(0,3).map(id=>contacts.find(c=>c.id===id)).filter(Boolean);
  updateQueueProgress();
  if(visible.length === 0){
    stack.innerHTML = '';
    document.getElementById('queueEmpty').style.display = 'flex';
    document.getElementById('queueActions').style.display = 'none';
    return;
  }
  document.getElementById('queueEmpty').style.display = 'none';
  document.getElementById('queueActions').style.display = 'flex';
  stack.innerHTML = visible.map(cardHtml).join('');
  const cardEls = stack.querySelectorAll('.queue-card');
  cardEls.forEach((el,i)=>{
    el.style.zIndex = String(10 - i);
    if(i===0){
      bindCardDrag(el);
    } else {
      el.style.transform = `translateY(${i*10}px) scale(${1 - i*0.04})`;
      el.style.opacity = String(1 - i*0.35);
      el.style.pointerEvents = 'none';
    }
  });
}

/* ---- swipe / drag physics on the front card ---- */
function bindCardDrag(el){
  let startX=0, startY=0, dx=0, dy=0, dragging=false, dragMoved=false;
  const hintPass = el.querySelector('.qc-hint-pass');
  const hintKeep = el.querySelector('.qc-hint-keep');

  function onDown(e){
    dragging = true; dragMoved = false; dx = 0; dy = 0;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    el.style.transition = 'none';
    if(el.setPointerCapture && e.pointerId != null){ try{ el.setPointerCapture(e.pointerId); }catch(err){} }
  }
  function onMove(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    dx = pt.clientX - startX; dy = pt.clientY - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragMoved = true;
    const rot = dx * 0.06;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    if(hintPass) hintPass.style.opacity = String(Math.min(Math.max(-dx/80, 0), 1));
    if(hintKeep) hintKeep.style.opacity = String(Math.min(Math.max(dx/80, 0), 1));
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    el.style.transition = 'transform .25s ease, opacity .25s ease';
    const THRESH = 100;
    if(dx > THRESH){
      flyOut(el, 1);
      resolveCard(el.dataset.id, 'keep');
    } else if(dx < -THRESH){
      flyOut(el, -1);
      resolveCard(el.dataset.id, 'pass');
    } else {
      el.style.transform = '';
      if(hintPass) hintPass.style.opacity = 0;
      if(hintKeep) hintKeep.style.opacity = 0;
    }
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('click', ()=>{ if(!dragMoved) openDetail(el.dataset.id); });
}
function flyOut(el, dir){
  el.style.transform = `translate(${dir*650}px, -30px) rotate(${dir*28}deg)`;
  el.style.opacity = '0';
}

/* ---- resolving a card: pass (skip today) or keep (logged a touchpoint) ---- */
async function resolveCard(id, action){
  const c = contacts.find(x=>x.id===id);
  queueIds = queueIds.filter(x=>x!==id);
  markDoneToday(id);
  persistQueueIds();
  if(action === 'keep' && c){
    try{
      const noteText = c.status === 'lead' ? 'Reached out — Daily Queue' : 'Followed up — Daily Queue';
      const note = await addNoteApi(c.id, noteText);
      c.notes = c.notes || [];
      c.notes.push(note);
      c.updatedAt = note.ts;
      if(c.status === 'lead'){
        await patchContact(c.id, { status:'contacted' });
        c.status = 'contacted';
      }
      renderStats();
    }catch(e){ /* toast already shown by apiFetch */ }
  }
  setTimeout(renderQueueStack, 220);
}
function callFrontCard(){
  const id = queueIds[0];
  const c = contacts.find(x=>x.id===id);
  if(!c || !c.phone){ showToast('No phone number on file', true); return; }
  window.location.href = `tel:${sanitizePhone(c.phone)}`;
}

/* ---- action buttons (mirror swipe gestures for accessibility / desktop) ---- */
document.getElementById('qaPassBtn').addEventListener('click', ()=>{
  if(!queueIds.length) return;
  const el = document.querySelector('.queue-card');
  if(el){ flyOut(el, -1); }
  resolveCard(queueIds[0], 'pass');
});
document.getElementById('qaKeepBtn').addEventListener('click', ()=>{
  if(!queueIds.length) return;
  const el = document.querySelector('.queue-card');
  if(el){ flyOut(el, 1); }
  resolveCard(queueIds[0], 'keep');
});
document.getElementById('qaCallBtn').addEventListener('click', callFrontCard);
document.getElementById('queueLoadMoreBtn').addEventListener('click', loadMoreQueue);

/* ---- settings modal ---- */
document.getElementById('queueSettingsBtn').addEventListener('click', openQueueSettingsModal);
function openQueueSettingsModal(){
  const s = getQueueSettings();
  const modal = document.getElementById('queueSettingsModal');
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <h2>Queue settings</h2>
        <div class="sub" style="margin-bottom:0;">Changes apply to tomorrow's queue, or the next time you tap "Get more" today.</div>
      </div>
      <button class="icon-btn" id="qsBack" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
    <div style="height:16px;"></div>
    <div class="field-group">
      <label>Businesses per day</label>
      <input id="qs_count" type="number" min="1" max="50" step="1" value="${s.dailyCount}">
    </div>
    <div class="field-row">
      <div class="field-group"><label>Follow up "Contacted" after (days)</label><input id="qs_contacted" type="number" min="1" max="90" value="${s.followUp.contacted}"></div>
      <div class="field-group"><label>Follow up "Proposal Sent" after (days)</label><input id="qs_proposal" type="number" min="1" max="90" value="${s.followUp.proposal}"></div>
    </div>
    <div class="field-group"><label>Check in on clients after (days)</label><input id="qs_client" type="number" min="1" max="365" value="${s.followUp.client}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="qsCancel">Cancel</button>
      <button class="btn btn-primary" id="qsSave">Save</button>
    </div>
  `;
  document.getElementById('queueSettingsModalBack').classList.add('open');
  pushOverlayState();
  const close = ()=>closeQueueSettingsModal();
  document.getElementById('qsBack').addEventListener('click', close);
  document.getElementById('qsCancel').addEventListener('click', close);
  document.getElementById('qsSave').addEventListener('click', ()=>{
    const next = {
      dailyCount: Math.max(1, parseInt(document.getElementById('qs_count').value, 10) || 8),
      followUp: {
        contacted: Math.max(1, parseInt(document.getElementById('qs_contacted').value, 10) || 3),
        proposal: Math.max(1, parseInt(document.getElementById('qs_proposal').value, 10) || 5),
        client: Math.max(1, parseInt(document.getElementById('qs_client').value, 10) || 30),
      },
    };
    saveQueueSettings(next);
    closeQueueSettingsModal();
    refreshQueueBadge();
    showToast('Queue settings saved');
  });
}
function closeQueueSettingsModal(fromPopstate){
  document.getElementById('queueSettingsModalBack').classList.remove('open');
  popOverlayState(fromPopstate);
}
document.getElementById('queueSettingsModalBack').addEventListener('click', (e)=>{ if(e.target.id==='queueSettingsModalBack') closeQueueSettingsModal(); });

/* ---- tabs ---- */
function switchTab(tab){
  const isQueue = tab === 'queue';
  document.getElementById('pipelineView').style.display = isQueue ? 'none' : '';
  document.getElementById('queueView').style.display = isQueue ? '' : 'none';
  document.getElementById('tabPipelineBtn').classList.toggle('active', !isQueue);
  document.getElementById('tabQueueBtn').classList.toggle('active', isQueue);
  if(isQueue) initQueueForToday();
}
document.getElementById('tabPipelineBtn').addEventListener('click', ()=>switchTab('pipeline'));
document.getElementById('tabQueueBtn').addEventListener('click', ()=>switchTab('queue'));

function peekQueueBadgeCount(){
  const idsKey = 'cm_queue_ids_' + todayKey();
  const cached = localStorage.getItem(idsKey);
  let remaining;
  if(cached !== null){
    try{
      remaining = JSON.parse(cached).filter(id => contacts.some(c=>c.id===id && c.status !== 'inactive')).length;
    }catch(e){ remaining = 0; }
  } else {
    const settings = getQueueSettings();
    const done = getDoneToday();
    remaining = computeEligiblePool().filter(c => !done.includes(c.id)).slice(0, settings.dailyCount).length;
  }
  refreshQueueBadge(remaining);
}

/* ============ INIT ============ */
(async function init(){
  await loadContacts();
  renderStats();
  renderList();
  peekQueueBadgeCount();
})();
</script>
